<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau Dashboards</title>

    <style scoped>
        .tableau-wrapper {
            zoom: 0.77;
            margin-bottom: 100px;
            /* tweak as needed */
        }


        .tableau-wrapper iframe,
        .tableau-wrapper object {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>
    <div style="padding: 10px; display: flex; justify-content: space-between; background-color: lightgrey;">
        <h1 style="margin: 0;">Dashboard 1</h1>
        <h3 style="margin: 0; align-self: center;">Feb 2025</h3>
    </div>

    <div class="tableau-wrapper">
        <div class="tableauPlaceholder" id="vizContainer"
            style="width: 2100px; height: 1500px; position: relative; overflow: hidden; display: block;">
            <noscript>
                <a href="#">
                    <img alt="Dashboard 1"
                        src="https://public.tableau.com/static/images/Da/Dashboard1_17446515300880/Dashboard1/1.png"
                        style="border: none" />
                </a>
            </noscript>
            <iframe frameborder="0" marginheight="0" marginwidth="0" title="Data Visualization" allowtransparency="true"
                allowfullscreen="true" class="tableauViz"
                style="display: block; width: 2100px; height: 1500px; margin: 0; padding: 0; border: none;"
                src="https://public.tableau.com/views/Dashboard1_17446515300880/Dashboard1?:embed=y&:showVizHome=no&:host_url=https%3A%2F%2Fpublic.tableau.com%2F&:embed_code_version=3&:tabs=no&:toolbar=yes&:animate_transition=yes&:display_static_image=no&:display_spinner=no&:display_overlay=yes&:display_count=yes&:language=en-US&publish=yes&:loadOrderID=8"></iframe>
        </div>
    </div>

    <div style="padding: 10px; display: flex; justify-content: space-between; background-color: lightgrey;">
        <h1 style="margin: 0;">Dashboard 2</h1>
        <h3 style="margin: 0; align-self: center;">Feb 2025</h3>
    </div>
    <div class="tableau-wrapper">
        <div class="tableauPlaceholder" id="vizContainer2"
            style="width: 2100px; height: 1500px; position: relative; overflow: hidden; display: block;">
            <noscript>
                <a href="#">
                    <img alt="Dashboard 2"
                        src="https://public.tableau.com/static/images/Da/Dashboard2_17446534577500/Dashboard2/1_rss.png"
                        style="border: none" />
                </a>
            </noscript>
            <iframe frameborder="0" marginheight="0" marginwidth="0" title="Data Visualization" allowtransparency="true"
                allowfullscreen="true" class="tableauViz"
                style="display: block; width: 2100px; height: 1500px; margin: 0; padding: 0; border: none;"
                src="https://public.tableau.com/views/Dashboard2_17446534577500/Dashboard2?:embed=y&:showVizHome=no&:host_url=https%3A%2F%2Fpublic.tableau.com%2F&:embed_code_version=3&:tabs=no&:toolbar=yes&:animate_transition=yes&:display_static_image=no&:display_spinner=no&:display_overlay=yes&:display_count=yes&:language=en-US&publish=yes&:loadOrderID=9"></iframe>
        </div>
    </div>

    <script src="https://public.tableau.com/javascripts/api/viz_v1.js"></script>
</body>

</html>
